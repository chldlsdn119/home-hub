<h1>home-hub 개인정보처리방침</h1>
<p>home-hub는 개인이 자기 집에서만 쓰는 대시보드입니다. 다른 사람에게 제공하는 서비스가 아닙니다.</p>
<p>Google 계정 연동은 집 안의 Home Assistant가 본인의 Google 어시스턴트에 기기 제어 명령을 보내는 데만 쓰입니다.
받은 인증 정보는 집 안의 기기에만 저장되며, 다른 곳으로 보내거나 공유하지 않습니다.</p>
<p>연동을 끊으려면 Google 계정의 <a href="https://myaccount.google.com/permissions">서드 파티 액세스</a>에서 home-hub를 삭제하면 됩니다.</p>
