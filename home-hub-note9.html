<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F5" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>우리집 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5;--card:#FFFFFF;--ink:#1F2329;--muted:#5F6670;--line:#E3E7EC;--accent:#1A73E8;--shadow:0 1px 3px rgba(31,35,41,.06);
  /* 공기질 등급: 타일 배경 / 글자 / 진한 점 */
  --a0:#E3F0FF;--c0:#1A6BD1;--d0:#3D8BFF;
  --a1:#E1F5E8;--c1:#17844A;--d1:#2BB56A;
  --a2:#FFEFD6;--c2:#B05E00;--d2:#FF9B1C;
  --a3:#FFE2E2;--c3:#C9363C;--d3:#FF5A5F;
  --tile:#F3F5F8;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
[data-theme="dark"]{
  --bg:#111316;--card:#1E2125;--ink:#E8EAED;--muted:#9AA0A8;--line:#2E3238;--accent:#8AB4F8;--shadow:none;
  --a0:#1B2B42;--c0:#8CC0FF;--a1:#183325;--c1:#7FDCA4;--a2:#3A2A14;--c2:#FFC172;--a3:#3D1F22;--c3:#FF9497;
  --tile:#1E2125;color-scheme:dark
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
.num{font-family:"Outfit",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:0 16px;font-size:15px;cursor:pointer;min-height:44px}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 레이아웃: 왼쪽 큰 날씨 카드, 오른쪽 위 시계 카드, 오른쪽 아래 타일 2개 */
.hub{height:100%;display:grid;grid-template-columns:1fr 1.28fr;grid-template-rows:1.3fr 1fr;grid-template-areas:"wx clock" "wx tiles";gap:12px;
  padding:max(16px,3.5vh) max(16px,env(safe-area-inset-right,0px)) max(16px,3.5vh) max(16px,env(safe-area-inset-left,0px));transition:transform 2s}
.card{border-radius:20px;background:var(--card);box-shadow:var(--shadow);min-width:0;min-height:0;overflow:hidden;position:relative}

/* 날씨 카드 */
.wx{grid-area:wx;color:#fff;padding:18px 20px 14px;display:flex;flex-direction:column;background:linear-gradient(165deg,#4FA3F7,#1E6FE0);transition:background 1s}
.wx[data-k="partly"]{background:linear-gradient(165deg,#62A4E6,#2F6CC2)}
.wx[data-k="cloud"]{background:linear-gradient(165deg,#8DA3BD,#5C7593)}
.wx[data-k="rain"]{background:linear-gradient(165deg,#6F86A6,#41587A)}
.wx[data-k="snow"]{background:linear-gradient(165deg,#A2BCD8,#6B8CB2)}
.wx[data-k="night"]{background:linear-gradient(165deg,#34437A,#1B2349)}
.wx-desc{font-size:17px;font-weight:500}
.wx-temp{font-size:min(19vh,78px);font-weight:300;line-height:1;margin-top:2px}
.hours{flex:1;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;text-align:center;min-height:0}
.hours .t{font-family:"Outfit",sans-serif;font-size:16px}
.hours svg{width:min(9vh,36px);height:min(9vh,36px);display:block;margin:4px auto}
.hours .h{font-size:12.5px;opacity:.9}
.wx-foot{border-top:1px solid rgba(255,255,255,.28);padding-top:9px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;opacity:.95}
.off{color:inherit;opacity:.8;font-size:14px;line-height:1.6;margin:auto 0}

/* 시계 카드 */
.clock{grid-area:clock;padding:16px 22px 16px;display:flex;flex-direction:column}
.c-top{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;min-height:24px}
.c-top svg{width:18px;height:18px;color:var(--accent);flex:none}
.mode{margin-left:auto;font-size:12.5px;color:var(--muted);border:none;padding:0 6px;min-height:32px}
.time{flex:1;display:flex;align-items:center;font-size:min(32vh,128px);font-weight:400;line-height:1;margin-left:-.03em}
.date{font-size:min(6.2vh,22px);font-weight:500;color:var(--accent)}

/* 공기 타일 */
.tiles{grid-area:tiles;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
.tile{background:var(--tile);border:none;border-radius:20px;padding:13px 16px 12px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;text-align:left;font-size:14px;min-height:0;box-shadow:var(--shadow);transition:background .6s}
.tile.g0{background:var(--a0)}.tile.g1{background:var(--a1)}.tile.g2{background:var(--a2)}.tile.g3{background:var(--a3)}
.tile svg.face{width:22px;height:22px;flex:none}
.t-grade{font-size:min(7.5vh,27px);font-weight:700;line-height:1.15;margin-top:4px}
.g0 .t-grade{color:var(--c0)}.g1 .t-grade{color:var(--c1)}.g2 .t-grade{color:var(--c2)}.g3 .t-grade{color:var(--c3)}
.t-val{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}
.t-val b{font-family:"Outfit",sans-serif;font-weight:500;color:var(--ink);font-size:15px}
.t-name{margin-top:auto;font-size:13.5px;font-weight:500;padding-top:6px}
.bar{height:4px;border-radius:2px;background:rgba(127,127,127,.18);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.g0 .bar i{background:var(--d0)}.g1 .bar i{background:var(--d1)}.g2 .bar i{background:var(--d2)}.g3 .bar i{background:var(--d3)}
.t-off{color:var(--muted);font-size:13px;line-height:1.5;margin-top:6px}

/* 설정 화면 */
.sheet{position:fixed;inset:0;background:var(--bg);display:none;overflow:auto;padding:5vh max(5vw,env(safe-area-inset-left,0px)) 4vh max(5vw,env(safe-area-inset-right,0px));z-index:5}
.sheet.open{display:block}
.sheet-in{max-width:620px;margin:0 auto}
.close{position:absolute;top:max(3vh,env(safe-area-inset-top,0px));right:max(4vw,env(safe-area-inset-right,0px))}
.sheet h2{font-size:19px;font-weight:500;margin:0 0 4px}
.sheet p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 90px 14px 0}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.field input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:none;border-bottom:1.5px solid var(--line);padding:6px 2px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.actions .pri{background:var(--accent);color:var(--card);border-color:var(--accent);font-weight:500}
#haMsg{font-size:14px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){.hub{transition:none}}
@media (orientation:portrait){
  body{overflow:auto}
  .hub{height:auto;min-height:100%;grid-template-columns:1fr;grid-template-rows:auto;grid-template-areas:"clock" "wx" "tiles";padding-top:max(16px,5vh)}
  .clock{min-height:200px}.time{font-size:30vw}
  .wx{min-height:300px}
  .tiles .tile{min-height:170px}
}
</style>
</head>
<body>
<main class="hub" id="hub">
  <section class="card wx" id="wx" aria-live="polite" aria-label="날씨">
    <p class="off">날씨를 불러오는 중이에요.</p>
  </section>

  <section class="card clock" aria-label="시계">
    <div class="c-top">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span id="hello"></span>
      <button type="button" id="themeBtn" class="mode">화면: 자동</button>
    </div>
    <div id="time" class="time num">--:--</div>
    <div id="date" class="date"></div>
  </section>

  <div class="tiles">
    <section class="tile" id="outTile" aria-label="바깥 공기">
      <div id="outAir"><div class="t-off">미세먼지를 불러오는 중이에요.</div></div>
      <div class="t-name">바깥 공기</div>
    </section>
    <button type="button" class="tile" id="inTile" aria-label="우리집 공기, 눌러서 공기청정기 연결 설정">
      <span id="inAir" style="display:block"><span class="t-off" style="display:block">공기청정기 연결 전이에요.<br>눌러서 설정</span></span>
      <span class="t-name">우리집 공기</span>
    </button>
  </div>
</main>

<section class="sheet" id="haSheet" aria-label="공기청정기 연결">
  <button type="button" class="close" data-close>닫기</button>
  <div class="sheet-in">
    <h2>공기청정기 연결 (Home Assistant)</h2>
    <p>Home Assistant에 연결한 공기청정기의 센서 값을 가져와요. 입력한 값은 이 기기에만 저장돼요.</p>
    <form id="haForm" autocomplete="off">
      <label class="field"><span>Home Assistant 주소</span><input id="haUrl" placeholder="http://localhost:8123" inputmode="url"></label>
      <label class="field"><span>장기 액세스 토큰</span><input id="haToken" type="password" placeholder="프로필 → 보안 → 장기 액세스 토큰"></label>
      <label class="field"><span>초미세먼지(PM2.5) 센서 — 비워 두면 자동으로 찾아요</span><input id="haPm" placeholder="자동으로 찾기"></label>
      <label class="field"><span>습도 센서 (선택)</span><input id="haHum" placeholder="자동으로 찾기"></label>
      <label class="field"><span>온도 센서 (선택)</span><input id="haTemp" placeholder="자동으로 찾기"></label>
      <div class="actions">
        <button type="submit" class="pri">저장하고 연결</button>
        <button type="button" id="haClear">연결 지우기</button>
        <span id="haMsg" aria-live="polite"></span>
      </div>
    </form>
  </div>
</section>

<script>
const LAT = 37.6, LON = 127.3;
const $ = s => document.querySelector(s);
const load = k => { try { return JSON.parse(localStorage.getItem('hub-' + k)); } catch (e) { return null; } };
const save = (k, v) => { try { localStorage.setItem('hub-' + k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const DAYS = ['일','월','화','수','목','금','토'];

/* 화면 모드: 자동(21~6시 어둡게) / 밝게 / 어둡게 */
let mode = load('sky-mode') || 'auto';
const isNight = h => h >= 21 || h < 6;
function hello(h) {
  if (h >= 5 && h < 11) return '좋은 아침이에요';
  if (h >= 11 && h < 17) return '즐거운 오후예요';
  if (h >= 17 && h < 21) return '오늘도 수고했어요';
  return '편안한 밤 되세요';
}
function applyTheme() {
  const h = new Date().getHours();
  const dark = mode === 'dark' || (mode === 'auto' && isNight(h));
  if (dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
  $('#themeColor').content = dark ? '#111316' : '#EEF1F5';
  $('#hello').textContent = hello(h);
  $('#themeBtn').textContent = { auto: '화면: 자동', light: '화면: 밝게', dark: '화면: 어둡게' }[mode];
}
$('#themeBtn').addEventListener('click', () => {
  mode = { auto: 'light', light: 'dark', dark: 'auto' }[mode];
  save('sky-mode', mode); applyTheme();
});

/* 시계 + 번인 방지 */
function shift() {
  const x = Math.round(Math.random() * 10 - 5), y = Math.round(Math.random() * 8 - 4);
  $('#hub').style.transform = `translate(${x}px, ${y}px)`;
}
function tick() {
  const d = new Date();
  $('#time').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  $('#date').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`;
  applyTheme();
  if (d.getMinutes() % 3 === 0) shift();
}
tick();
setTimeout(() => { tick(); setInterval(tick, 60000); }, (60 - new Date().getSeconds()) * 1000);

/* 색이 채워진 날씨 그림 */
const CLOUD = (y = 0) => `<path d="M14 ${38 + y}h20a8 8 0 0 0 .8-15.96A11 11 0 0 0 13.6 20.4 8.4 8.4 0 0 0 14 ${38 + y}z" fill="#FFFFFF" stroke="#C9D8EA" stroke-width="1.5" stroke-linejoin="round"/>`;
const SUN = (cx, cy, r) => {
  let rays = '';
  for (let a = 0; a < 360; a += 45) {
    const t = a * Math.PI / 180;
    rays += `M${(cx + Math.cos(t) * (r + 4)).toFixed(1)} ${(cy + Math.sin(t) * (r + 4)).toFixed(1)}L${(cx + Math.cos(t) * (r + 9)).toFixed(1)} ${(cy + Math.sin(t) * (r + 9)).toFixed(1)}`;
  }
  return `<path d="${rays}" stroke="#FFD15C" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#FFCE3D"/>`;
};
const MOON = (cx, cy, s = 1) => `<path transform="translate(${cx} ${cy}) scale(${s})" d="M8 6A13 13 0 1 1-6-12 10.5 10.5 0 0 0 8 6z" fill="#FFE08A"/>`;
const SV = inner => `<svg viewBox="0 0 48 48" aria-hidden="true">${inner}</svg>`;
const ICON = {
  sun: SV(SUN(24, 24, 10)),
  moon: SV(MOON(26, 26, 1.1)),
  partly: SV(SUN(17, 17, 7) + CLOUD(2)),
  partlyNight: SV(MOON(19, 18, .75) + CLOUD(2)),
  cloud: SV(CLOUD(0)),
  fog: SV(CLOUD(-4) + '<path d="M10 40h28M14 45h20" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity=".85"/>'),
  rain: SV(CLOUD(-4) + '<path d="M17 39l-2 5M25 39l-2 5M33 39l-2 5" stroke="#8FD0FF" stroke-width="3" stroke-linecap="round"/>'),
  snow: SV(CLOUD(-4) + '<g fill="#FFFFFF"><circle cx="16" cy="41" r="2.4"/><circle cx="24" cy="44" r="2.4"/><circle cx="32" cy="41" r="2.4"/></g>'),
  storm: SV(CLOUD(-4) + '<path d="M25 35l-4 6h5l-3 6" fill="none" stroke="#FFD15C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>')
};
function wmo(c, day = 1) {
  if (c === 0) return ['맑음', day ? 'sun' : 'moon'];
  if (c <= 2) return ['구름 조금', day ? 'partly' : 'partlyNight'];
  if (c === 3) return ['흐림', 'cloud'];
  if (c <= 48) return ['안개', 'fog'];
  if (c <= 67 || (c >= 80 && c <= 82)) return ['비', 'rain'];
  if (c <= 77 || c === 85 || c === 86) return ['눈', 'snow'];
  return ['뇌우', 'storm'];
}
const cardKind = (ic, day) => !day ? 'night' : ({ sun: 'sun', partly: 'partly', cloud: 'cloud', fog: 'cloud', rain: 'rain', storm: 'rain', snow: 'snow' }[ic] || 'sun');
const hourLabel = h => h === 0 ? '오전 12시' : h < 12 ? `오전 ${h}시` : h === 12 ? '오후 12시' : `오후 ${h - 12}시`;

async function weather() {
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code,is_day&hourly=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=2`;
    const r = await fetch(u);
    if (!r.ok) throw new Error('bad');
    const j = await r.json();
    const [desc, ic] = wmo(j.current.weather_code, j.current.is_day);
    const now = j.current.time.slice(0, 13);
    let i = j.hourly.time.findIndex(t => t.slice(0, 13) === now);
    if (i < 0) i = 0;
    let hours = `<div><div class="t">${Math.round(j.current.temperature_2m)}°</div>${ICON[ic]}<div class="h">현재</div></div>`;
    for (let k = 1; k <= 3; k++) {
      const idx = i + k * 3;
      if (idx >= j.hourly.time.length) break;
      const hc = wmo(j.hourly.weather_code[idx], j.hourly.is_day[idx])[1];
      hours += `<div><div class="t">${Math.round(j.hourly.temperature_2m[idx])}°</div>${ICON[hc]}<div class="h">${hourLabel(Number(j.hourly.time[idx].slice(11, 13)))}</div></div>`;
    }
    $('#wx').dataset.k = cardKind(ic, j.current.is_day);
    $('#wx').innerHTML = `
      <div class="wx-desc">${desc}</div>
      <div class="wx-temp num">${Math.round(j.current.temperature_2m)}°</div>
      <div class="hours">${hours}</div>
      <div class="wx-foot"><span>오늘 최고 ${Math.round(j.daily.temperature_2m_max[0])}° · 최저 ${Math.round(j.daily.temperature_2m_min[0])}°</span><span>비 ${Math.round(j.daily.precipitation_probability_max[0] ?? 0)}%</span></div>`;
  } catch (e) {
    $('#wx').innerHTML = '<p class="off">날씨를 불러오지 못했어요. 잠시 뒤 다시 시도해요.</p>';
  }
}

/* 미세먼지 등급 (환경부 기준, ㎍/㎥) */
const GRADE = ['좋음', '보통', '나쁨', '매우 나쁨'];
const CUT = { pm10: [30, 80, 150], pm25: [15, 35, 75] };
const grade = (v, cut) => { const i = cut.findIndex(x => v <= x); return i < 0 ? 3 : i; };
const MOUTH = ['M13 24q7 8 14 0', 'M14 25q6 3.5 12 0', 'M14 27h12', 'M13 29q7-7 14 0'];
const face = g => `<svg class="face" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="var(--d${g})"/><circle cx="14" cy="16" r="2.8" fill="#fff"/><circle cx="26" cy="16" r="2.8" fill="#fff"/><path d="${MOUTH[g]}" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>`;
// 초미세먼지 0~100㎍/㎥를 막대 길이로 (버튼 안에서도 쓰도록 span 사용)
const bar = pm25 => `<span class="bar" style="display:block"><i style="width:${Math.min(100, Math.max(6, pm25))}%"></i></span>`;
const setGrade = (el, g) => { el.classList.remove('g0', 'g1', 'g2', 'g3'); if (g !== null) el.classList.add('g' + g); };

async function outdoorAir() {
  try {
    const u = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=pm10,pm2_5&hourly=pm10,pm2_5&timezone=Asia%2FSeoul&forecast_days=2`;
    const r = await fetch(u);
    if (!r.ok) throw new Error('bad');
    const j = await r.json();
    const p10 = Math.round(j.current.pm10), p25 = Math.round(j.current.pm2_5);
    const g = Math.max(grade(p10, CUT.pm10), grade(p25, CUT.pm25));
    const now = j.current.time.slice(0, 13);
    let i = j.hourly.time.findIndex(t => t.slice(0, 13) === now), note = '';
    if (i >= 0) {
      for (let k = 1; k <= 6 && i + k < j.hourly.time.length; k++) {
        const hg = Math.max(grade(j.hourly.pm10[i + k], CUT.pm10), grade(j.hourly.pm2_5[i + k], CUT.pm25));
        if (hg > g) { note = ` · ${Number(j.hourly.time[i + k].slice(11, 13))}시쯤 ${GRADE[hg]}`; break; }
      }
    }
    setGrade($('#outTile'), g);
    $('#outAir').innerHTML = `${face(g)}<div class="t-grade">${GRADE[g]}</div>
      <div class="t-val">미세 <b>${p10}</b> · 초미세 <b>${p25}</b>${note}</div>${bar(p25)}`;
  } catch (e) {
    setGrade($('#outTile'), null);
    $('#outAir').innerHTML = '<div class="t-off">미세먼지를 불러오지 못했어요.</div>';
  }
}

/* 우리집 공기: Home Assistant REST API */
let ha = load('ha');
async function haState(id) {
  const r = await fetch(`${ha.url.replace(/\/+$/, '')}/api/states/${encodeURIComponent(id)}`, { headers: { Authorization: `Bearer ${ha.token}` } });
  if (r.status === 401) throw new Error('토큰이 맞지 않아요.');
  if (r.status === 404) throw new Error(`센서 ${id}를 찾지 못했어요.`);
  if (!r.ok) throw new Error(`응답 오류 (${r.status})`);
  const s = await r.json();
  const v = parseFloat(s.state);
  return Number.isFinite(v) ? v : null;
}
const inOff = msg => { setGrade($('#inTile'), null); $('#inAir').innerHTML = `<span class="t-off" style="display:block">${msg}</span>`; };
async function indoorAir() {
  if (!ha || !ha.url || !ha.token || !ha.pm) { inOff('공기청정기 연결 전이에요.<br>눌러서 설정'); return null; }
  try {
    const [pm, hum, temp] = await Promise.all([
      haState(ha.pm),
      ha.hum ? haState(ha.hum).catch(() => null) : null,
      ha.temp ? haState(ha.temp).catch(() => null) : null
    ]);
    if (pm === null) throw new Error('공기청정기 값이 비어 있어요.');
    const g = grade(pm, CUT.pm25);
    let extra = '';
    if (hum !== null) extra += ` · 습도 <b>${Math.round(hum)}</b>%`;
    if (temp !== null) extra += ` · <b>${Math.round(temp)}</b>°`;
    setGrade($('#inTile'), g);
    $('#inAir').innerHTML = `${face(g)}<span class="t-grade" style="display:block">${GRADE[g]}</span>
      <span class="t-val" style="display:block">초미세 <b>${Math.round(pm)}</b>${extra}</span>${bar(pm)}`;
    return true;
  } catch (e) {
    const msg = e instanceof TypeError ? 'Home Assistant에 연결하지 못했어요.' : e.message;
    inOff(`${esc(msg)}<br>눌러서 설정 확인`);
    return msg;
  }
}

/* 설정 화면 */
function openSheet() {
  const c = ha || {};
  $('#haUrl').value = c.url || 'http://localhost:8123';
  $('#haToken').value = c.token || '';
  $('#haPm').value = c.pm || '';
  $('#haHum').value = c.hum || '';
  $('#haTemp').value = c.temp || '';
  $('#haMsg').textContent = '';
  $('#haSheet').classList.add('open');
}
const closeSheet = () => $('#haSheet').classList.remove('open');
$('#inTile').addEventListener('click', openSheet);
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheet));
// 센서 칸을 비워 두면 Home Assistant에서 초미세먼지·습도·온도 센서를 자동으로 찾기
async function findSensors() {
  const r = await fetch(`${ha.url.replace(/\/+$/, '')}/api/states`, { headers: { Authorization: `Bearer ${ha.token}` } });
  if (r.status === 401) throw new Error('토큰이 맞지 않아요.');
  if (!r.ok) throw new Error(`응답 오류 (${r.status})`);
  const all = (await r.json()).filter(s => s.entity_id.startsWith('sensor.'));
  const byClass = c => all.filter(s => s.attributes && s.attributes.device_class === c);
  const pm = byClass('pm25')[0];
  if (!pm) throw new Error('초미세먼지 센서를 찾지 못했어요. 센서 이름을 직접 넣어 주세요.');
  // 같은 기기(이름 앞부분이 같은 센서)를 먼저 고르기
  const prefix = pm.entity_id.replace(/_pm2_?5$/, '');
  const pick = c => (byClass(c).find(s => s.entity_id.startsWith(prefix)) || byClass(c)[0] || {}).entity_id || '';
  return { pm: pm.entity_id, hum: pick('humidity'), temp: pick('temperature') };
}

$('#haForm').addEventListener('submit', async e => {
  e.preventDefault();
  ha = { url: $('#haUrl').value.trim(), token: $('#haToken').value.trim(), pm: $('#haPm').value.trim(), hum: $('#haHum').value.trim(), temp: $('#haTemp').value.trim() };
  if (!ha.url || !ha.token) { $('#haMsg').textContent = '주소와 토큰은 꼭 넣어 주세요.'; return; }
  $('#haMsg').textContent = '연결해 보는 중…';
  if (!ha.pm) {
    try {
      const f = await findSensors();
      ha.pm = f.pm; ha.hum = ha.hum || f.hum; ha.temp = ha.temp || f.temp;
      $('#haPm').value = ha.pm; $('#haHum').value = ha.hum; $('#haTemp').value = ha.temp;
    } catch (err) {
      $('#haMsg').textContent = err instanceof TypeError ? 'Home Assistant에 연결하지 못했어요.' : err.message;
      return;
    }
  }
  save('ha', ha);
  const ok = await indoorAir();
  if (ok === true) { $('#haMsg').textContent = '연결됐어요.'; setTimeout(closeSheet, 800); }
  else $('#haMsg').textContent = ok;
});
$('#haClear').addEventListener('click', () => {
  ha = null;
  try { localStorage.removeItem('hub-ha'); } catch (e) {}
  indoorAir(); $('#haMsg').textContent = '연결 정보를 지웠어요.';
});

/* 갱신 주기 */
function refreshOutdoor() { weather(); outdoorAir(); }
refreshOutdoor();
indoorAir();
setInterval(refreshOutdoor, 30 * 60 * 1000);
setInterval(indoorAir, 60 * 1000);

/* 화면 켜짐 유지 */
let lock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) {}
}
document.addEventListener('click', keepAwake);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); refreshOutdoor(); indoorAir(); } });
</script>
