<!doctype html>
<html lang="ko" data-sky="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BDE3FF" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>우리집 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/* 시간대별 하늘 팔레트: morning / day / evening / night */
:root{
  --grad:linear-gradient(160deg,#BDE3FF 0%,#E6F5FF 50%,#D6F5E6 100%);
  --sheet:#EEF8FF;--ink:#1E2B4A;--muted:#5D6A86;--card:rgba(255,255,255,.78);--line:rgba(30,43,74,.1);
  --accent:#2F80ED;--blob1:rgba(255,255,255,.7);--blob2:rgba(255,236,170,.55);--shadow:0 6px 20px rgba(30,43,74,.08);
  --g0:#3D9BFF;--g1:#2FBF71;--g2:#FF9F1C;--g3:#FF5A5F;--t0:#1F75D1;--t1:#17924F;--t2:#C46A00;--t3:#D63B40;
  --b-wx:#FFE9A8;--b-out:#C9F2DD;--b-in:#FFD9CC;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
[data-sky="morning"]{--grad:linear-gradient(150deg,#FFD9BF 0%,#FFF1D2 48%,#D3ECFF 100%);--sheet:#FFF5EA;--ink:#2B2D42;--muted:#6E6A80;--accent:#FF7A59;--blob2:rgba(255,200,150,.5)}
[data-sky="evening"]{--grad:linear-gradient(150deg,#FFC4B0 0%,#F9D2E6 50%,#D6CBFF 100%);--sheet:#FBEFF6;--ink:#3A2340;--muted:#7A6380;--accent:#E2557B;--blob2:rgba(255,170,190,.5)}
[data-sky="night"]{--grad:linear-gradient(160deg,#1B2350 0%,#2A2160 55%,#3B2A6B 100%);--sheet:#221F55;--ink:#F2F0FF;--muted:#B6B3D9;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.12);
  --accent:#FFD36E;--blob1:rgba(140,120,255,.18);--blob2:rgba(255,211,110,.12);--shadow:none;
  --t0:#8CC4FF;--t1:#7FE0A8;--t2:#FFC266;--t3:#FF8E91;--b-wx:rgba(255,211,110,.2);--b-out:rgba(127,224,168,.2);--b-in:rgba(255,142,145,.2);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--grad);background-color:var(--sheet);color:var(--ink);font-family:"Gowun Dodum",system-ui,-apple-system,"Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden;position:relative}
body::before,body::after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(10px)}
body::before{width:46vmax;height:46vmax;left:-14vmax;top:-20vmax;background:radial-gradient(circle,var(--blob1),transparent 70%)}
body::after{width:40vmax;height:40vmax;right:-12vmax;bottom:-18vmax;background:radial-gradient(circle,var(--blob2),transparent 70%)}
.num{font-family:"Fredoka",system-ui,sans-serif;font-weight:500;font-variant-numeric:tabular-nums;line-height:.85}
.jua{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400}
button{font:inherit;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:0 16px;font-size:15px;cursor:pointer;min-height:44px}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hub{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:1fr auto;row-gap:3.5vh;padding:4vh max(4.5vw,env(safe-area-inset-left,0px)) 4.5vh max(4.5vw,env(safe-area-inset-right,0px));transition:transform 2s}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:3vw;min-height:0;position:relative}
.clock{display:flex;align-items:flex-end;flex-wrap:wrap;column-gap:3.5vw;row-gap:1vh;min-width:0}
.time{font-size:min(42vh,22vw);font-weight:500;line-height:.8;letter-spacing:-.01em}
.time .colon{color:var(--accent)}
.when{padding-bottom:.6vh}
.hello{display:inline-block;font-size:min(4.6vh,16px);color:var(--accent);background:var(--card);padding:5px 12px;border-radius:999px;margin-bottom:8px;box-shadow:var(--shadow)}
.date{font-size:min(7vh,3.6vw);color:var(--ink)}
.mode{position:absolute;top:-1vh;right:-8px;color:var(--muted);font-size:13px;border:none;padding:0 8px;min-height:36px}

.cards{display:grid;grid-template-columns:1.55fr 1fr 1fr;gap:12px;height:min(43vh,210px)}
.card{background:var(--card);border:none;border-radius:28px;padding:14px 18px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;text-align:left;font-size:15px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
button.card{align-items:stretch;justify-content:flex-start}
.lbl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-height:24px}
.bub{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.bub svg{width:16px;height:16px}
.card-main{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}

.wx-now{display:flex;align-items:center;gap:12px}
.wx-now svg{width:min(15vh,60px);height:auto;flex:none}
.wx-temp{font-size:min(15vh,62px)}
.wx-desc{font-size:17px}
.wx-sub{color:var(--muted);font-size:13px;margin-top:2px}
.hours{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding-top:8px;border-top:1.5px dashed var(--line)}
.hours svg{width:24px;height:24px;display:block;margin:1px auto}
.hours .h{font-size:12px;color:var(--muted)}
.hours .t{font-family:"Fredoka",sans-serif;font-size:15px;font-weight:500}
.off{color:var(--muted);font-size:13px;line-height:1.5;margin:auto 0}

.aq-head{display:flex;align-items:center;gap:10px}
.aq-head svg{width:min(11vh,44px);height:min(11vh,44px);flex:none}
.aq-grade{font-size:min(8vh,30px);line-height:1.1}
.t0{color:var(--t0)}.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}
.aq-rows{margin-top:10px;display:grid;gap:4px}
.aq-rows>*{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;color:var(--muted)}
.aq-rows b{font-family:"Fredoka",sans-serif;font-weight:600;font-size:18px;color:var(--ink)}
.aq-rows .t0{color:var(--t0)}.aq-rows .t1{color:var(--t1)}.aq-rows .t2{color:var(--t2)}.aq-rows .t3{color:var(--t3)}
.aq-rows small{font-size:11px;color:var(--muted);margin-left:2px}
.aq-note{margin-top:8px;font-size:13px;color:var(--t2)}

.sheet{position:fixed;inset:0;background:var(--sheet);display:none;overflow:auto;padding:5vh max(5vw,env(safe-area-inset-left,0px)) 4vh max(5vw,env(safe-area-inset-right,0px));z-index:5}
.sheet.open{display:block}
.sheet-in{max-width:620px;margin:0 auto}
.close{position:absolute;top:max(3vh,env(safe-area-inset-top,0px));right:max(4vw,env(safe-area-inset-right,0px))}
.sheet h2{font-family:"Jua",sans-serif;font-weight:400;font-size:20px;margin:0 0 4px}
.sheet p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 90px 14px 0}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.field input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:none;border-bottom:1.5px solid var(--line);padding:6px 2px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.actions .pri{background:var(--accent);color:#fff;border-color:var(--accent)}
[data-sky="night"] .actions .pri{color:#1B2350}
#haMsg{font-size:14px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){.hub{transition:none}}
@media (orientation:portrait){
  body{overflow:auto}
  .hub{grid-template-rows:auto;height:auto;min-height:100%;row-gap:5vh;padding-top:9vh}
  .clock{flex-direction:column;align-items:flex-start}
  .time{font-size:30vw}.date{font-size:5.5vw}.hello{font-size:3.8vw}
  .mode{top:-6vh}
  .cards{grid-template-columns:1fr 1fr;height:auto}
  .cards .wxc{grid-column:1/-1}
  .cards .card{min-height:170px}
}
</style>
</head>
<body>
<main class="hub" id="hub">
  <div class="top">
    <section class="clock" aria-label="시계">
      <div id="time" class="time num">--:--</div>
      <div class="when">
        <span class="hello jua" id="hello"></span>
        <div id="date" class="date jua"></div>
      </div>
    </section>
    <button type="button" id="themeBtn" class="mode">화면: 자동</button>
  </div>
  <div class="cards">
    <section class="card wxc" id="wx" aria-live="polite" aria-label="날씨">
      <p class="off">날씨를 불러오는 중이에요.</p>
    </section>
    <section class="card" aria-label="바깥 공기">
      <span class="lbl"><span class="bub" style="background:var(--b-out)"><svg viewBox="0 0 24 24" fill="none" stroke="var(--t1)" stroke-width="2.2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/></svg></span>바깥 공기</span>
      <div class="card-main" id="outAir"><p class="off">미세먼지를 불러오는 중이에요.</p></div>
    </section>
    <button type="button" class="card" id="inCard" aria-label="실내 공기, 눌러서 공기청정기 연결 설정">
      <span class="lbl"><span class="bub" style="background:var(--b-in)"><svg viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M9 16h6"/></svg></span>우리집 공기</span>
      <span class="card-main" id="inAir"><span class="off">공기청정기 연결 전이에요.<br>눌러서 설정</span></span>
    </button>
  </div>
</main>

<section class="sheet" id="haSheet" aria-label="공기청정기 연결">
  <button type="button" class="close" data-close>닫기</button>
  <div class="sheet-in">
    <h2>공기청정기 연결 (Home Assistant)</h2>
    <p>Home Assistant에 연결한 공기청정기의 센서 값을 가져와요. 입력한 값은 이 기기에만 저장돼요.</p>
    <form id="haForm" autocomplete="off">
      <label class="field"><span>Home Assistant 주소</span><input id="haUrl" placeholder="http://localhost:8123" inputmode="url"></label>
      <label class="field"><span>장기 액세스 토큰</span><input id="haToken" type="password" placeholder="프로필 → 보안 → 장기 액세스 토큰"></label>
      <label class="field"><span>초미세먼지(PM2.5) 센서</span><input id="haPm" placeholder="sensor.air_purifier_pm2_5"></label>
      <label class="field"><span>습도 센서 (선택)</span><input id="haHum" placeholder="sensor.air_purifier_humidity"></label>
      <label class="field"><span>온도 센서 (선택)</span><input id="haTemp" placeholder="sensor.air_purifier_temperature"></label>
      <div class="actions">
        <button type="submit" class="pri">저장하고 연결</button>
        <button type="button" id="haClear">연결 지우기</button>
        <span id="haMsg" aria-live="polite"></span>
      </div>
    </form>
  </div>
</section>

<script>
const LAT = 37.6, LON = 127.3;
const $ = s => document.querySelector(s);
const load = k => { try { return JSON.parse(localStorage.getItem('hub-' + k)); } catch (e) { return null; } };
const save = (k, v) => { try { localStorage.setItem('hub-' + k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const DAYS = ['일','월','화','수','목','금','토'];

/* 하늘 팔레트: 자동(시간대) / 밝게(밤에도 밝게) / 어둡게(항상 밤) */
const SKY = {
  morning: ['좋은 아침이에요', '#FFD9BF'],
  day: ['즐거운 하루 보내세요', '#BDE3FF'],
  evening: ['오늘도 수고했어요', '#FFC4B0'],
  night: ['편안한 밤 되세요', '#1B2350']
};
let mode = load('sky-mode') || 'auto';
function skyFor(h) {
  if (h >= 5 && h < 11) return 'morning';
  if (h >= 11 && h < 17) return 'day';
  if (h >= 17 && h < 21) return 'evening';
  return 'night';
}
function applySky() {
  const h = new Date().getHours();
  let sky = skyFor(h);
  if (mode === 'dark') sky = 'night';
  if (mode === 'light' && sky === 'night') sky = h < 5 ? 'morning' : 'evening';
  document.documentElement.dataset.sky = sky;
  $('#hello').textContent = SKY[skyFor(h)][0];
  $('#themeColor').content = SKY[sky][1];
  $('#themeBtn').textContent = { auto: '화면: 자동', light: '화면: 밝게', dark: '화면: 어둡게' }[mode];
}
$('#themeBtn').addEventListener('click', () => {
  mode = { auto: 'light', light: 'dark', dark: 'auto' }[mode];
  save('sky-mode', mode); applySky();
});

/* 시계 + 번인 방지 */
function shift() {
  const x = Math.round(Math.random() * 12 - 6), y = Math.round(Math.random() * 8 - 4);
  $('#hub').style.transform = `translate(${x}px, ${y}px)`;
}
function tick() {
  const d = new Date();
  $('#time').innerHTML = String(d.getHours()).padStart(2, '0') + '<span class="colon">:</span>' + String(d.getMinutes()).padStart(2, '0');
  $('#date').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`;
  applySky();
  if (d.getMinutes() % 3 === 0) shift();
}
tick();
setTimeout(() => { tick(); setInterval(tick, 60000); }, (60 - new Date().getSeconds()) * 1000);

/* 색이 채워진 날씨 그림 */
const CLOUD = (y = 0) => `<path d="M14 ${38 + y}h20a8 8 0 0 0 .8-15.96A11 11 0 0 0 13.6 20.4 8.4 8.4 0 0 0 14 ${38 + y}z" fill="#FFFFFF" stroke="#9DB4D0" stroke-width="2" stroke-linejoin="round"/>`;
const SUN = (cx, cy, r) => {
  let rays = '';
  for (let a = 0; a < 360; a += 45) {
    const t = a * Math.PI / 180, x1 = cx + Math.cos(t) * (r + 4), y1 = cy + Math.sin(t) * (r + 4), x2 = cx + Math.cos(t) * (r + 9), y2 = cy + Math.sin(t) * (r + 9);
    rays += `M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}`;
  }
  return `<path d="${rays}" stroke="#FFB020" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#FFC93C"/>`;
};
const MOON = (cx, cy, s = 1) => `<path transform="translate(${cx} ${cy}) scale(${s})" d="M8 6A13 13 0 1 1-6-12 10.5 10.5 0 0 0 8 6z" fill="#FFE08A" stroke="#F5C04A" stroke-width="1.5" stroke-linejoin="round"/>`;
const SV = inner => `<svg viewBox="0 0 48 48" aria-hidden="true">${inner}</svg>`;
const ICON = {
  sun: SV(SUN(24, 24, 10)),
  moon: SV(MOON(26, 26, 1.1)),
  partly: SV(SUN(17, 17, 7) + CLOUD(2)),
  partlyNight: SV(MOON(19, 18, .75) + CLOUD(2)),
  cloud: SV(CLOUD(0)),
  fog: SV(CLOUD(-4) + '<path d="M10 40h28M14 45h20" stroke="#9DB4D0" stroke-width="2.6" stroke-linecap="round"/>'),
  rain: SV(CLOUD(-4) + '<path d="M17 39l-2 5M25 39l-2 5M33 39l-2 5" stroke="#4DA3FF" stroke-width="3" stroke-linecap="round"/>'),
  snow: SV(CLOUD(-4) + '<g fill="#8CC8FF"><circle cx="16" cy="41" r="2.4"/><circle cx="24" cy="44" r="2.4"/><circle cx="32" cy="41" r="2.4"/></g>'),
  storm: SV(CLOUD(-4) + '<path d="M25 35l-4 6h5l-3 6" fill="none" stroke="#FFB020" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>')
};
function wmo(c, day = 1) {
  if (c === 0) return ['맑음', day ? 'sun' : 'moon'];
  if (c <= 2) return ['구름 조금', day ? 'partly' : 'partlyNight'];
  if (c === 3) return ['흐림', 'cloud'];
  if (c <= 48) return ['안개', 'fog'];
  if (c <= 67 || (c >= 80 && c <= 82)) return ['비', 'rain'];
  if (c <= 77 || c === 85 || c === 86) return ['눈', 'snow'];
  return ['뇌우', 'storm'];
}
async function weather() {
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code,is_day&hourly=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=2`;
    const r = await fetch(u);
    if (!r.ok) throw new Error('bad');
    const j = await r.json();
    const [desc, ic] = wmo(j.current.weather_code, j.current.is_day);
    const now = j.current.time.slice(0, 13);
    let i = j.hourly.time.findIndex(t => t.slice(0, 13) === now);
    if (i < 0) i = 0;
    let hours = '';
    for (let k = 1; k <= 4; k++) {
      const idx = i + k * 2;
      if (idx >= j.hourly.time.length) break;
      hours += `<div><div class="h">${Number(j.hourly.time[idx].slice(11, 13))}시</div>${ICON[wmo(j.hourly.weather_code[idx], j.hourly.is_day[idx])[1]]}<div class="t">${Math.round(j.hourly.temperature_2m[idx])}°</div></div>`;
    }
    $('#wx').innerHTML = `
      <div class="card-main"><div class="wx-now">${ICON[ic]}<div class="wx-temp num">${Math.round(j.current.temperature_2m)}°</div>
        <div><div class="wx-desc jua">${desc}</div><div class="wx-sub">최고 ${Math.round(j.daily.temperature_2m_max[0])}° · 최저 ${Math.round(j.daily.temperature_2m_min[0])}°<br>오늘 비 올 확률 ${Math.round(j.daily.precipitation_probability_max[0] ?? 0)}%</div></div></div></div>
      <div class="hours">${hours}</div>`;
  } catch (e) {
    $('#wx').innerHTML = '<p class="off">날씨를 불러오지 못했어요. 잠시 뒤 다시 시도해요.</p>';
  }
}

/* 미세먼지 등급 (환경부 기준, ㎍/㎥) + 얼굴 */
const GRADE = ['좋음', '보통', '나쁨', '매우 나쁨'];
const CUT = { pm10: [30, 80, 150], pm25: [15, 35, 75] };
const grade = (v, cut) => { const i = cut.findIndex(x => v <= x); return i < 0 ? 3 : i; };
const MOUTH = ['M13 24q7 8 14 0', 'M14 25q6 3.5 12 0', 'M14 27h12', 'M13 29q7-7 14 0'];
const face = g => `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="var(--g${g})"/><circle cx="14" cy="16" r="2.6" fill="#fff"/><circle cx="26" cy="16" r="2.6" fill="#fff"/><path d="${MOUTH[g]}" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/></svg>`;
const head = g => `<div class="aq-head">${face(g)}<span class="aq-grade jua t${g}">${GRADE[g]}</span></div>`;

async function outdoorAir() {
  try {
    const u = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=pm10,pm2_5&hourly=pm10,pm2_5&timezone=Asia%2FSeoul&forecast_days=2`;
    const r = await fetch(u);
    if (!r.ok) throw new Error('bad');
    const j = await r.json();
    const p10 = Math.round(j.current.pm10), p25 = Math.round(j.current.pm2_5);
    const g10 = grade(p10, CUT.pm10), g25 = grade(p25, CUT.pm25), g = Math.max(g10, g25);
    const now = j.current.time.slice(0, 13);
    let i = j.hourly.time.findIndex(t => t.slice(0, 13) === now), note = '';
    if (i >= 0) {
      for (let k = 1; k <= 6 && i + k < j.hourly.time.length; k++) {
        const hg = Math.max(grade(j.hourly.pm10[i + k], CUT.pm10), grade(j.hourly.pm2_5[i + k], CUT.pm25));
        if (hg > g) { note = `<div class="aq-note">${Number(j.hourly.time[i + k].slice(11, 13))}시쯤 ${GRADE[hg]}</div>`; break; }
      }
    }
    $('#outAir').innerHTML = `${head(g)}
      <div class="aq-rows">
        <div>미세먼지<span><b class="t${g10}">${p10}</b><small>㎍/㎥</small></span></div>
        <div>초미세먼지<span><b class="t${g25}">${p25}</b><small>㎍/㎥</small></span></div>
      </div>${note}`;
  } catch (e) {
    $('#outAir').innerHTML = '<p class="off">미세먼지를 불러오지 못했어요.</p>';
  }
}

/* 우리집 공기: Home Assistant REST API */
let ha = load('ha');
async function haState(id) {
  const r = await fetch(`${ha.url.replace(/\/+$/, '')}/api/states/${encodeURIComponent(id)}`, { headers: { Authorization: `Bearer ${ha.token}` } });
  if (r.status === 401) throw new Error('토큰이 맞지 않아요.');
  if (r.status === 404) throw new Error(`센서 ${id}를 찾지 못했어요.`);
  if (!r.ok) throw new Error(`응답 오류 (${r.status})`);
  const s = await r.json();
  const v = parseFloat(s.state);
  return Number.isFinite(v) ? v : null;
}
async function indoorAir() {
  if (!ha || !ha.url || !ha.token || !ha.pm) {
    $('#inAir').innerHTML = '<span class="off">공기청정기 연결 전이에요.<br>눌러서 설정</span>';
    return null;
  }
  try {
    const [pm, hum, temp] = await Promise.all([
      haState(ha.pm),
      ha.hum ? haState(ha.hum).catch(() => null) : null,
      ha.temp ? haState(ha.temp).catch(() => null) : null
    ]);
    if (pm === null) throw new Error('공기청정기 값이 비어 있어요.');
    const g = grade(pm, CUT.pm25);
    const row = (name, val, unit, cls = '') => `<span>${name}<span><b class="${cls}">${Math.round(val)}</b><small>${unit}</small></span></span>`;
    let rows = row('초미세먼지', pm, '㎍/㎥', `t${g}`);
    if (hum !== null) rows += row('습도', hum, '%');
    if (temp !== null) rows += row('온도', temp, '°');
    $('#inAir').innerHTML = `<span class="aq-head">${face(g)}<span class="aq-grade jua t${g}">${GRADE[g]}</span></span><span class="aq-rows">${rows}</span>`;
    return true;
  } catch (e) {
    const msg = e instanceof TypeError ? 'Home Assistant에 연결하지 못했어요.' : e.message;
    $('#inAir').innerHTML = `<span class="off">${esc(msg)}<br>눌러서 설정 확인</span>`;
    return msg;
  }
}

/* 설정 화면 */
function openSheet() {
  const c = ha || {};
  $('#haUrl').value = c.url || 'http://localhost:8123';
  $('#haToken').value = c.token || '';
  $('#haPm').value = c.pm || '';
  $('#haHum').value = c.hum || '';
  $('#haTemp').value = c.temp || '';
  $('#haMsg').textContent = '';
  $('#haSheet').classList.add('open');
}
const closeSheet = () => $('#haSheet').classList.remove('open');
$('#inCard').addEventListener('click', openSheet);
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheet));
$('#haForm').addEventListener('submit', async e => {
  e.preventDefault();
  ha = { url: $('#haUrl').value.trim(), token: $('#haToken').value.trim(), pm: $('#haPm').value.trim(), hum: $('#haHum').value.trim(), temp: $('#haTemp').value.trim() };
  if (!ha.url || !ha.token || !ha.pm) { $('#haMsg').textContent = '주소, 토큰, 초미세먼지 센서는 꼭 넣어 주세요.'; return; }
  save('ha', ha);
  $('#haMsg').textContent = '연결해 보는 중…';
  const ok = await indoorAir();
  if (ok === true) { $('#haMsg').textContent = '연결됐어요.'; setTimeout(closeSheet, 800); }
  else $('#haMsg').textContent = ok;
});
$('#haClear').addEventListener('click', () => {
  ha = null;
  try { localStorage.removeItem('hub-ha'); } catch (e) {}
  indoorAir(); $('#haMsg').textContent = '연결 정보를 지웠어요.';
});

/* 갱신 주기 */
function refreshOutdoor() { weather(); outdoorAir(); }
refreshOutdoor();
indoorAir();
setInterval(refreshOutdoor, 30 * 60 * 1000);
setInterval(indoorAir, 60 * 1000);

/* 화면 켜짐 유지 */
let lock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) {}
}
document.addEventListener('click', keepAwake);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); refreshOutdoor(); indoorAir(); } });
</script>
