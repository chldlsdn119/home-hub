<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>우리집 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8EDEA;--panel:#F8FAF9;--ink:#1F2A2E;--muted:#5A6B6F;--line:#C9D3CE;--accent:#2F6F8F;--g0:#1F6FB8;--g1:#2E8540;--g2:#C2610E;--g3:#C0392B;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--panel:#14191C;--ink:#E3EAE7;--muted:#8A9A9E;--line:#26333A;--accent:#86BCD4;--g0:#6FB1EE;--g1:#6CC584;--g2:#F0A54A;--g3:#F07A6E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--panel:#14191C;--ink:#E3EAE7;--muted:#8A9A9E;--line:#26333A;--accent:#86BCD4;--g0:#6FB1EE;--g1:#6CC584;--g2:#F0A54A;--g3:#F07A6E;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden;transition:background .6s}
.num{font-family:"Outfit",system-ui,sans-serif;font-weight:500;font-variant-numeric:tabular-nums;line-height:.85;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:0 16px;font-size:15px;cursor:pointer;min-height:44px}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hub{height:100%;display:grid;grid-template-rows:1fr auto;row-gap:3.5vh;padding:4vh max(4.5vw,env(safe-area-inset-left,0px)) 4.5vh max(4.5vw,env(safe-area-inset-right,0px));transition:transform 2s}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:3vw;min-height:0;position:relative}
.clock{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:3.5vw;row-gap:1vh;min-width:0}
.time{font-size:min(44vh,24vw);font-weight:400;line-height:.78;margin-left:-.04em}
.date{font-size:min(6.8vh,3.6vw);color:var(--muted)}
.mode{position:absolute;top:-1vh;right:-8px;color:var(--muted);font-size:13px;border:none;padding:0 8px;min-height:36px}

.cards{display:grid;grid-template-columns:1.55fr 1fr 1fr;gap:12px;height:min(43vh,210px)}
.card{background:var(--panel);border:none;border-radius:26px;padding:14px 18px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;text-align:left;font-size:15px}
button.card{align-items:stretch;justify-content:flex-start}
.lbl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-height:20px}
.lbl svg{width:18px;height:18px;flex:none}
.card-main{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}

.wx-now{display:flex;align-items:center;gap:12px}
.wx-now svg{width:min(13vh,52px);height:auto;color:var(--accent);flex:none}
.wx-temp{font-size:min(15vh,62px);font-weight:400}
.wx-desc{font-size:15px}
.wx-sub{color:var(--muted);font-size:13px;margin-top:2px}
.hours{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding-top:8px;border-top:1px solid var(--line)}
.hours svg{width:20px;height:20px;color:var(--accent);display:block;margin:2px auto}
.hours .h{font-size:12px;color:var(--muted)}
.hours .t{font-size:14px;font-weight:500}
.off{color:var(--muted);font-size:13px;line-height:1.5;margin:auto 0}

.aq-grade{display:flex;align-items:center;gap:10px;font-size:min(8vh,32px);font-weight:500;line-height:1.1}
.aq-grade::before{content:"";width:.42em;height:.42em;border-radius:50%;background:currentColor;flex:none}
.g0{color:var(--g0)}.g1{color:var(--g1)}.g2{color:var(--g2)}.g3{color:var(--g3)}
.aq-rows{margin-top:10px;display:grid;gap:4px}
.aq-rows>*{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;color:var(--muted)}
.aq-rows b{font-family:"Outfit",system-ui,sans-serif;font-weight:500;font-size:18px;color:var(--ink)}
.aq-rows .g0{color:var(--g0)}.aq-rows .g1{color:var(--g1)}.aq-rows .g2{color:var(--g2)}.aq-rows .g3{color:var(--g3)}
.aq-rows small{font-size:11px;color:var(--muted);margin-left:2px}
.aq-note{margin-top:8px;font-size:13px;color:var(--muted)}
.aq-note.warn{color:var(--g2)}

.sheet{position:fixed;inset:0;background:var(--bg);display:none;overflow:auto;padding:5vh max(5vw,env(safe-area-inset-left,0px)) 4vh max(5vw,env(safe-area-inset-right,0px));z-index:5}
.sheet.open{display:block}
.sheet-in{max-width:620px;margin:0 auto}
.close{position:absolute;top:max(3vh,env(safe-area-inset-top,0px));right:max(4vw,env(safe-area-inset-right,0px))}
.sheet h2{font-size:18px;font-weight:500;margin:0 0 4px}
.sheet p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 90px 14px 0}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.field input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:none;border-bottom:1.5px solid var(--line);padding:6px 2px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.actions .pri{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:500}
#haMsg{font-size:14px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){.hub{transition:none}}
@media (orientation:portrait){
  body{overflow:auto}
  .hub{grid-template-rows:auto;height:auto;min-height:100%;row-gap:5vh;padding-top:9vh}
  .clock{flex-direction:column;align-items:flex-start}
  .time{font-size:34vw}.date{font-size:5.5vw}
  .mode{top:-6vh}
  .cards{grid-template-columns:1fr 1fr;height:auto}
  .cards .wxc{grid-column:1/-1}
  .cards .card{min-height:160px}
}
</style>
</head>
<body>
<main class="hub" id="hub">
  <div class="top">
    <section class="clock" aria-label="시계">
      <div id="time" class="time num">--:--</div>
      <div id="date" class="date"></div>
    </section>
    <button type="button" id="themeBtn" class="mode">화면: 자동</button>
  </div>
  <div class="cards">
    <section class="card wxc" id="wx" aria-live="polite" aria-label="날씨">
      <p class="off">날씨를 불러오는 중이에요.</p>
    </section>
    <section class="card" aria-label="바깥 공기">
      <span class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/></svg>바깥 공기</span>
      <div class="card-main" id="outAir"><p class="off">미세먼지를 불러오는 중이에요.</p></div>
    </section>
    <button type="button" class="card" id="inCard" aria-label="실내 공기, 눌러서 공기청정기 연결 설정">
      <span class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M9 15h6M9 18h4"/></svg>실내 공기</span>
      <span class="card-main" id="inAir"><span class="off">공기청정기 연결 전이에요.<br>눌러서 설정</span></span>
    </button>
  </div>
</main>

<section class="sheet" id="haSheet" aria-label="공기청정기 연결">
  <button type="button" class="close" data-close>닫기</button>
  <div class="sheet-in">
    <h2>공기청정기 연결 (Home Assistant)</h2>
    <p>Home Assistant에 연결한 공기청정기의 센서 값을 가져와요. 입력한 값은 이 기기에만 저장되고 깃허브에는 올라가지 않아요.</p>
    <form id="haForm" autocomplete="off">
      <label class="field"><span>Home Assistant 주소</span><input id="haUrl" placeholder="http://localhost:8123" inputmode="url"></label>
      <label class="field"><span>장기 액세스 토큰</span><input id="haToken" type="password" placeholder="프로필 → 보안 → 장기 액세스 토큰"></label>
      <label class="field"><span>초미세먼지(PM2.5) 센서</span><input id="haPm" placeholder="sensor.air_purifier_pm2_5"></label>
      <label class="field"><span>습도 센서 (선택)</span><input id="haHum" placeholder="sensor.air_purifier_humidity"></label>
      <label class="field"><span>온도 센서 (선택)</span><input id="haTemp" placeholder="sensor.air_purifier_temperature"></label>
      <div class="actions">
        <button type="submit" class="pri">저장하고 연결</button>
        <button type="button" id="haClear">연결 지우기</button>
        <span id="haMsg" aria-live="polite"></span>
      </div>
    </form>
  </div>
</section>

<script>
const LAT = 37.6, LON = 127.3;
const $ = s => document.querySelector(s);
const load = k => { try { return JSON.parse(localStorage.getItem('hub-' + k)); } catch (e) { return null; } };
const save = (k, v) => { try { localStorage.setItem('hub-' + k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const DAYS = ['일','월','화','수','목','금','토'];

/* 화면 모드 */
let mode = load('mode') || 'dark';
function applyTheme() {
  const h = new Date().getHours(), r = document.documentElement;
  if (mode === 'light') r.dataset.theme = 'light';
  else if (mode === 'dark') r.dataset.theme = 'dark';
  else if (h >= 22 || h < 7) r.dataset.theme = 'dark';
  else delete r.dataset.theme;
  $('#themeBtn').textContent = { auto: '화면: 자동', light: '화면: 밝게', dark: '화면: 어둡게' }[mode];
}
$('#themeBtn').addEventListener('click', () => {
  mode = { dark: 'auto', auto: 'light', light: 'dark' }[mode];
  save('mode', mode); applyTheme();
});

/* 시계 + 번인 방지 */
function shift() {
  const x = Math.round(Math.random() * 12 - 6), y = Math.round(Math.random() * 8 - 4);
  $('#hub').style.transform = `translate(${x}px, ${y}px)`;
}
function tick() {
  const d = new Date();
  $('#time').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  $('#date').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`;
  applyTheme();
  if (d.getMinutes() % 3 === 0) shift();
}
tick();
setTimeout(() => { tick(); setInterval(tick, 60000); }, (60 - new Date().getSeconds()) * 1000);

/* 날씨 */
const S = 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
const C2 = '<path d="M7 15h10a4 4 0 0 0 .4-7.98A6 6 0 0 0 6.2 6.6 4.2 4.2 0 0 0 7 15z"/>';
const ICON = {
  sun: `<svg viewBox="0 0 24 24" ${S}><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>`,
  partly: `<svg viewBox="0 0 24 24" ${S}><circle cx="8" cy="8" r="3"/><path d="M8 2.5v1.2M2.5 8h1.2M4.1 4.1l.9.9M11.9 4.1l-.9.9"/><path d="M9 20h8a3.5 3.5 0 0 0 .3-6.98A5 5 0 0 0 8.2 12.3 3.8 3.8 0 0 0 9 20z"/></svg>`,
  cloud: `<svg viewBox="0 0 24 24" ${S}><path d="M7 18h10a4 4 0 0 0 .4-7.98A6 6 0 0 0 6.2 9.6 4.2 4.2 0 0 0 7 18z"/></svg>`,
  fog: `<svg viewBox="0 0 24 24" ${S}><path d="M4 9h16M3 13h18M5 17h14"/></svg>`,
  rain: `<svg viewBox="0 0 24 24" ${S}>${C2}<path d="M8 18l-1 2.5M12 18l-1 2.5M16 18l-1 2.5"/></svg>`,
  snow: `<svg viewBox="0 0 24 24" ${S}>${C2}<path d="M8 19h.01M12 20.5h.01M16 19h.01"/></svg>`,
  storm: `<svg viewBox="0 0 24 24" ${S}>${C2}<path d="M12.5 16l-2 3h3l-2 3"/></svg>`,
  moon: `<svg viewBox="0 0 24 24" ${S}><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>`,
  partlyNight: `<svg viewBox="0 0 24 24" ${S}><path d="M12 9.2A4 4 0 1 1 6.8 4a3.2 3.2 0 0 0 5.2 5.2z"/><path d="M9 20h8a3.5 3.5 0 0 0 .3-6.98A5 5 0 0 0 8.2 12.3 3.8 3.8 0 0 0 9 20z"/></svg>`
};
function wmo(c, day = 1) {
  if (c === 0) return ['맑음', day ? 'sun' : 'moon'];
  if (c <= 2) return ['구름 조금', day ? 'partly' : 'partlyNight'];
  if (c === 3) return ['흐림', 'cloud'];
  if (c <= 48) return ['안개', 'fog'];
  if (c <= 67 || (c >= 80 && c <= 82)) return ['비', 'rain'];
  if (c <= 77 || c === 85 || c === 86) return ['눈', 'snow'];
  return ['뇌우', 'storm'];
}
async function weather() {
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code,is_day&hourly=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=2`;
    const r = await fetch(u);
    if (!r.ok) throw new Error('bad');
    const j = await r.json();
    const [desc, ic] = wmo(j.current.weather_code, j.current.is_day);
    const now = j.current.time.slice(0, 13);
    let i = j.hourly.time.findIndex(t => t.slice(0, 13) === now);
    if (i < 0) i = 0;
    let hours = '';
    for (let k = 1; k <= 4; k++) {
      const idx = i + k * 2;
      if (idx >= j.hourly.time.length) break;
      hours += `<div><div class="h">${Number(j.hourly.time[idx].slice(11, 13))}시</div>${ICON[wmo(j.hourly.weather_code[idx], j.hourly.is_day[idx])[1]]}<div class="t">${Math.round(j.hourly.temperature_2m[idx])}°</div></div>`;
    }
    $('#wx').innerHTML = `
      <div class="card-main"><div class="wx-now">${ICON[ic]}<div class="wx-temp num">${Math.round(j.current.temperature_2m)}°</div>
        <div><div class="wx-desc">${desc}</div><div class="wx-sub">최고 ${Math.round(j.daily.temperature_2m_max[0])}° · 최저 ${Math.round(j.daily.temperature_2m_min[0])}°<br>오늘 비 올 확률 ${Math.round(j.daily.precipitation_probability_max[0] ?? 0)}%</div></div></div></div>
      <div class="hours">${hours}</div>`;
  } catch (e) {
    $('#wx').innerHTML = '<p class="off">날씨를 불러오지 못했어요. 잠시 뒤 다시 시도해요.</p>';
  }
}

/* 미세먼지 등급 (환경부 기준, ㎍/㎥) */
const GRADE = ['좋음', '보통', '나쁨', '매우 나쁨'];
const CUT = { pm10: [30, 80, 150], pm25: [15, 35, 75] };
const grade = (v, cut) => { const i = cut.findIndex(x => v <= x); return i < 0 ? 3 : i; };

async function outdoorAir() {
  try {
    const u = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=pm10,pm2_5&hourly=pm10,pm2_5&timezone=Asia%2FSeoul&forecast_days=2`;
    const r = await fetch(u);
    if (!r.ok) throw new Error('bad');
    const j = await r.json();
    const p10 = Math.round(j.current.pm10), p25 = Math.round(j.current.pm2_5);
    const g10 = grade(p10, CUT.pm10), g25 = grade(p25, CUT.pm25), g = Math.max(g10, g25);
    // 앞으로 6시간 안에 지금보다 나빠지면 알려 주기
    const now = j.current.time.slice(0, 13);
    let i = j.hourly.time.findIndex(t => t.slice(0, 13) === now), note = '';
    if (i >= 0) {
      for (let k = 1; k <= 6 && i + k < j.hourly.time.length; k++) {
        const hg = Math.max(grade(j.hourly.pm10[i + k], CUT.pm10), grade(j.hourly.pm2_5[i + k], CUT.pm25));
        if (hg > g) { note = `<div class="aq-note warn">${Number(j.hourly.time[i + k].slice(11, 13))}시쯤 ${GRADE[hg]}</div>`; break; }
      }
    }
    $('#outAir').innerHTML = `
      <div class="aq-grade g${g}">${GRADE[g]}</div>
      <div class="aq-rows">
        <div>미세먼지<span><b class="g${g10}">${p10}</b><small>㎍/㎥</small></span></div>
        <div>초미세먼지<span><b class="g${g25}">${p25}</b><small>㎍/㎥</small></span></div>
      </div>${note}`;
  } catch (e) {
    $('#outAir').innerHTML = '<p class="off">미세먼지를 불러오지 못했어요.</p>';
  }
}

/* 실내 공기: Home Assistant REST API */
let ha = load('ha');
async function haState(id) {
  const r = await fetch(`${ha.url.replace(/\/+$/, '')}/api/states/${encodeURIComponent(id)}`, { headers: { Authorization: `Bearer ${ha.token}` } });
  if (r.status === 401) throw new Error('토큰이 맞지 않아요.');
  if (r.status === 404) throw new Error(`센서 ${id}를 찾지 못했어요.`);
  if (!r.ok) throw new Error(`응답 오류 (${r.status})`);
  const s = await r.json();
  const v = parseFloat(s.state);
  return Number.isFinite(v) ? v : null;
}
async function indoorAir() {
  if (!ha || !ha.url || !ha.token || !ha.pm) {
    $('#inAir').innerHTML = '<span class="off">공기청정기 연결 전이에요.<br>눌러서 설정</span>';
    return null;
  }
  try {
    const [pm, hum, temp] = await Promise.all([
      haState(ha.pm),
      ha.hum ? haState(ha.hum).catch(() => null) : null,
      ha.temp ? haState(ha.temp).catch(() => null) : null
    ]);
    if (pm === null) throw new Error('공기청정기 값이 비어 있어요.');
    const g = grade(pm, CUT.pm25);
    const row = (name, val, unit, cls = '') => `<span>${name}<span><b class="${cls}">${Math.round(val)}</b><small>${unit}</small></span></span>`;
    let rows = row('초미세먼지', pm, '㎍/㎥', `g${g}`);
    if (hum !== null) rows += row('습도', hum, '%');
    if (temp !== null) rows += row('온도', temp, '°');
    $('#inAir').innerHTML = `<span class="aq-grade g${g}">${GRADE[g]}</span><span class="aq-rows">${rows}</span>`;
    return true;
  } catch (e) {
    const msg = e instanceof TypeError ? 'Home Assistant에 연결하지 못했어요.' : e.message;
    $('#inAir').innerHTML = `<span class="off">${esc(msg)}<br>눌러서 설정 확인</span>`;
    return msg;
  }
}

/* 설정 화면 */
function openSheet() {
  const c = ha || {};
  $('#haUrl').value = c.url || 'http://localhost:8123';
  $('#haToken').value = c.token || '';
  $('#haPm').value = c.pm || '';
  $('#haHum').value = c.hum || '';
  $('#haTemp').value = c.temp || '';
  $('#haMsg').textContent = '';
  $('#haSheet').classList.add('open');
}
const closeSheet = () => $('#haSheet').classList.remove('open');
$('#inCard').addEventListener('click', openSheet);
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheet));
$('#haForm').addEventListener('submit', async e => {
  e.preventDefault();
  ha = { url: $('#haUrl').value.trim(), token: $('#haToken').value.trim(), pm: $('#haPm').value.trim(), hum: $('#haHum').value.trim(), temp: $('#haTemp').value.trim() };
  if (!ha.url || !ha.token || !ha.pm) { $('#haMsg').textContent = '주소, 토큰, 초미세먼지 센서는 꼭 넣어 주세요.'; return; }
  save('ha', ha);
  $('#haMsg').textContent = '연결해 보는 중…';
  const ok = await indoorAir();
  if (ok === true) { $('#haMsg').textContent = '연결됐어요.'; setTimeout(closeSheet, 800); }
  else $('#haMsg').textContent = ok;
});
$('#haClear').addEventListener('click', () => {
  ha = null;
  try { localStorage.removeItem('hub-ha'); } catch (e) {}
  indoorAir(); $('#haMsg').textContent = '연결 정보를 지웠어요.';
});

/* 갱신 주기 */
function refreshOutdoor() { weather(); outdoorAir(); }
refreshOutdoor();
indoorAir();
setInterval(refreshOutdoor, 30 * 60 * 1000);
setInterval(indoorAir, 60 * 1000);

/* 화면 켜짐 유지 */
let lock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) {}
}
document.addEventListener('click', keepAwake);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); refreshOutdoor(); indoorAir(); } });
</script>
