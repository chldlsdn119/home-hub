<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EDE1" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>우리집 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4EDE1;--ink:#221D19;--sub:#6E6152;--line:#D3C4AC;--frame:#D9CBB4;--accent:#93401F;--red:#B23A2B;--seal-ink:#FBEFE4;
  --sesi:#C8742A;--mine:#2F5A8A;--track:#E3D7C3;--paper:#FFFCF6;
  /* 공기 등급: 좋음 / 보통 / 나쁨 / 매우 나쁨 */
  --g0:#2F6A9A;--g1:#3F6A2C;--g2:#B0680F;--g3:#B23A2B;
  color-scheme:light
}
[data-theme="night"]{
  --bg:#14110D;--ink:#BFA98A;--sub:#6E5E4A;--line:#2A241C;--frame:#2A241C;--accent:#6E5E4A;--red:#7A4234;--seal-ink:#14110D;
  --sesi:#7A5A34;--mine:#3E5470;--track:#221D17;--paper:#221D17;
  --g0:#3E5C78;--g1:#4F6E3E;--g2:#7A5420;--g3:#7A3A2E;
  color-scheme:dark
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Gowun Batang",serif;font-weight:700;-webkit-tap-highlight-color:transparent;overflow:hidden;transition:background 1.5s,color 1.5s}
button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:4px;padding:0 16px;font-size:15px;cursor:pointer;min-height:44px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hub{height:100%;padding:max(10px,2.6vh) max(12px,env(safe-area-inset-right,0px)) max(10px,2.6vh) max(12px,env(safe-area-inset-left,0px));transition:transform 2s}
/* 한지 이중 테두리 */
.frame{height:100%;border:1px solid var(--frame);outline:1px solid var(--frame);outline-offset:-7px;border-radius:6px;position:relative;
  display:grid;grid-template-columns:auto 1.05fr 1fr;align-items:center;gap:clamp(12px,3vw,26px);padding:0 clamp(16px,3.4vw,30px);transition:border-color 1.5s,outline-color 1.5s}

.wday{writing-mode:vertical-rl;letter-spacing:.35em;font-size:clamp(18px,5.8vh,26px);color:var(--accent)}
.wday.red{color:var(--red)}
.center{min-width:0}
.time{font-size:min(36vh,16vw);line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums;cursor:pointer;user-select:none}
.date{font-size:clamp(14px,4.4vh,20px);color:var(--sub);margin-top:.4em}
.date .red{color:var(--red)}
.seals{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:clamp(6px,2vh,12px);font-size:clamp(13px,3.6vh,17px);color:var(--sub)}
.seal{display:inline-block;padding:.08em .45em;border-radius:2px;line-height:1.45;font-size:clamp(13px,3.8vh,17px);background:var(--red);color:var(--seal-ink)}
.seal.sesi{background:var(--sesi)}
.seal.mine{background:transparent;color:var(--mine);box-shadow:inset 0 0 0 1px var(--mine)}
.soon{font-size:clamp(13px,3.6vh,17px);color:var(--sub);margin-top:clamp(4px,1.4vh,8px)}
.soon b{color:var(--red);font-weight:700}

/* 오른쪽: 날씨 / 바깥 공기 / 우리집 공기 */
.side{border-left:1px solid var(--line);padding-left:clamp(12px,2.2vw,18px);min-width:0;padding-bottom:clamp(58px,17vh,74px)}
.row{display:grid;grid-template-columns:clamp(56px,17vh,72px) 1fr;align-items:center;gap:clamp(8px,1.6vw,14px);padding:clamp(4px,1.3vh,7px) 0;border-bottom:1px dashed var(--line);text-align:left;width:100%;border-radius:0}
.row:last-child{border-bottom:none}
button.row{border-width:0 0 0 0;padding-left:0;padding-right:0;min-height:0}
.row svg{width:100%;height:auto;display:block}
.r-main{font-size:clamp(20px,6.4vh,28px);line-height:1.25}
.r-main .big{font-size:clamp(32px,10.5vh,46px)}
.r-sub{font-size:clamp(15px,4.4vh,19px);color:var(--sub);margin-top:2px;line-height:1.35}
.bar{height:clamp(8px,2.2vh,10px);border-radius:4px;background:var(--track);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.g0{color:var(--g0)}.g1{color:var(--g1)}.g2{color:var(--g2)}.g3{color:var(--g3)}
.off{font-size:clamp(15px,4.4vh,19px);color:var(--sub);line-height:1.45}

/* 밤: 왼쪽 큰 시계, 오른쪽에 요일·날짜·음력과 그림 */
.nright,.nseal{display:none}
[data-theme="night"] .frame{grid-template-columns:auto auto;justify-content:center;column-gap:clamp(22px,4.4vw,40px)}
[data-theme="night"] .wday,[data-theme="night"] .side,[data-theme="night"] .date,[data-theme="night"] .sunline,[data-theme="night"] .seals,[data-theme="night"] .soon{display:none}
[data-theme="night"] .time{font-weight:400;font-size:min(60vh,25vw);letter-spacing:-.04em}
[data-theme="night"] .nright{display:block;border-left:1px solid var(--line);padding-left:clamp(18px,3.2vw,28px);min-width:0}
.nright .nw{font-size:clamp(34px,13vh,56px);color:var(--ink);letter-spacing:.12em;line-height:1.1}
.nright .nd{font-size:clamp(22px,8.4vh,36px);color:#A08C70;margin-top:.25em;white-space:nowrap}
.nright .nl{font-size:clamp(18px,6.4vh,28px);color:#8A7860;margin-top:.2em;white-space:nowrap}
.nright .red{color:#B0604C}
.nicons{display:flex;gap:clamp(14px,3vw,24px);margin-top:clamp(12px,4.4vh,24px);opacity:.9}
.nicons span{width:clamp(34px,11vh,48px);display:block}
.nicons svg{width:100%;height:auto;display:block}
[data-theme="night"] .nseal{display:flex;gap:6px;position:absolute;top:clamp(14px,4.4vh,22px);right:clamp(16px,3vw,26px)}
.nseal .seal{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1px var(--red);font-weight:400}

/* 주방등 버튼: 오른쪽 아래 구석 도장 */
.lamp{position:absolute;right:clamp(16px,3vw,26px);bottom:clamp(14px,4.4vh,22px);min-height:0;width:clamp(58px,16.5vh,70px);height:clamp(58px,16.5vh,70px);padding:4px;
  border:1.5px solid var(--accent);border-radius:6px;background:var(--paper);color:var(--accent);font-size:clamp(14px,4vh,17px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1;transition:background .3s,color .3s}
.lamp span{width:55%;display:block}
.lamp svg{width:100%;height:auto;display:block}
.lamp[aria-pressed="true"]{background:#E3A23B;border-color:#C98A22;color:#3A2A10}
.lamp.busy{opacity:.55}
.lamp[hidden]{display:none}
[data-theme="night"] .lamp{display:none}
/* 공기청정기 버튼(주방 버튼 왼쪽)과 설정 창 */
.lamp.fanb{right:calc(clamp(16px,3vw,26px) + clamp(58px,16.5vh,70px) + 10px);border-color:#5E8A47;color:#2F4A22}
.lamp.fanb[aria-pressed="true"]{background:#7FA36A;border-color:#5E8A47;color:#fff}
.pnl{position:absolute;right:clamp(16px,3vw,26px);bottom:calc(clamp(14px,4.4vh,22px) + clamp(58px,16.5vh,70px) + 10px);width:min(62vw,470px);z-index:3;
  background:var(--paper);border:1.5px solid var(--accent);border-radius:8px;padding:clamp(10px,3vh,14px) 16px;box-shadow:0 6px 20px rgba(60,40,20,.12)}
.pnl[hidden]{display:none}
.pnl-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:clamp(14px,4vh,17px)}
.pnl-h button{border:none;min-height:36px;padding:0 4px;font-size:14px;color:var(--sub)}
.pr{display:grid;grid-template-columns:clamp(48px,9vw,70px) 1fr;align-items:center;gap:8px;padding:clamp(4px,1.4vh,7px) 0;border-bottom:1px dashed var(--line);font-size:clamp(13px,3.8vh,16px)}
.pr:last-child{border-bottom:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.lv button{min-height:clamp(32px,9vh,40px);border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:0 14px;font-size:clamp(13px,3.8vh,15px);font-weight:700;background:transparent}
.seg button[aria-pressed="true"]{background:#7FA36A;border-color:#5E8A47;color:#fff}
.lv{display:flex;align-items:center;gap:8px}
.lv button{width:clamp(32px,9vh,40px);padding:0;font-size:20px}
.lv i{flex:1;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.lv i b{display:block;height:100%;background:#7FA36A;border-radius:4px}
.lv span{font-size:13px;color:var(--sub);min-width:3.6em;text-align:right}
.pnl.busy{opacity:.7}
[data-theme="night"] .pnl{display:none}
/* 해 뜸·해 짐, 눌러서 여는 창, 배터리 경고 */
.sunline{font-size:clamp(13px,3.6vh,17px);color:var(--sub);margin-top:.35em;display:flex;align-items:center;gap:6px}
.sunline svg{width:1.2em;height:1.2em;flex:none}
.tap,.seal[data-term]{cursor:pointer}
.pnl.info{top:clamp(12px,3.6vh,18px);bottom:auto;width:min(70vw,560px)}
#termPnl{left:clamp(110px,18vw,160px);right:auto;top:auto;bottom:clamp(50px,16vh,72px);width:min(56vw,440px)}
.hrs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:4px 0 10px;border-bottom:1px dashed var(--line);text-align:center}
.hrs .h{font-size:clamp(12px,3.4vh,14px);color:var(--sub)}
.hrs .i{width:clamp(34px,10vh,44px);margin:4px auto}
.hrs .t{font-size:clamp(16px,4.8vh,20px)}
.hrs .p{font-size:12px;color:#4F7FA8;min-height:1.2em}
.tmr{display:flex;align-items:center;gap:12px;padding-top:10px;font-size:clamp(14px,4.2vh,17px)}
.tmr span:first-child{width:clamp(34px,10vh,44px);flex:none}
.tmr em{font-style:normal;margin-left:auto;color:var(--red)}
.term-t{font-size:clamp(14px,4.2vh,17px);line-height:1.7;padding-top:2px;font-weight:400}
.term-s{font-size:clamp(13px,3.8vh,15px);color:var(--sub);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.graph svg{width:100%;height:auto;display:block}
.graph-s{font-size:clamp(13px,3.8vh,15px);color:var(--sub);margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.graph-s button{min-height:34px;font-size:13px;padding:0 10px}
.batt{position:absolute;top:clamp(10px,3.2vh,16px);left:clamp(16px,2.6vw,22px);font-size:clamp(13px,3.8vh,16px)!important;z-index:2}
.batt[hidden]{display:none}
[data-theme="night"] .batt{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
@media (orientation:portrait){.lamp{bottom:16px}}
.toast{position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:4px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:.92}

/* 설정 화면 */
.sheet{position:fixed;inset:0;background:var(--bg);display:none;overflow:auto;padding:5vh max(5vw,env(safe-area-inset-left,0px)) 4vh max(5vw,env(safe-area-inset-right,0px));z-index:5;font-weight:400}
.sheet.open{display:block}
.sheet-in{max-width:620px;margin:0 auto}
.close{position:absolute;top:max(3vh,env(safe-area-inset-top,0px));right:max(4vw,env(safe-area-inset-right,0px))}
.sheet h2{font-size:19px;font-weight:700;margin:0 0 4px}
.sheet p{color:var(--sub);font-size:14px;line-height:1.6;margin:0 90px 14px 0}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--sub);margin-bottom:2px}
.field input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:none;border-bottom:1.5px solid var(--line);padding:6px 2px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.actions .pri{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
#haMsg{font-size:14px;color:var(--sub)}

@media (prefers-reduced-motion:reduce){.hub,body{transition:none}}
@media (orientation:portrait){
  body{overflow:auto}
  .hub{height:auto;min-height:100%}
  .frame{grid-template-columns:auto 1fr;grid-template-areas:"w c" "s s";align-items:start;padding:28px 22px;row-gap:22px;min-height:calc(100vh - 6vh)}
  .wday{grid-area:w}.center{grid-area:c}
  .side{grid-area:s;border-left:none;border-top:1px solid var(--line);padding:10px 0 0}
  .time{font-size:24vw}
  [data-theme="night"] .frame{grid-template-columns:1fr;grid-template-areas:"c" "n";align-content:center}
  [data-theme="night"] .nright{grid-area:n;border-left:none;padding-left:0}
  [data-theme="night"] .time{font-size:28vw}
}
</style>
</head>
<body>
<main class="hub" id="hub">
  <div class="frame">
    <div class="wday" id="wday"></div>
    <div class="center">
      <div class="time" id="time" role="button" tabindex="0" aria-label="시계, 눌러서 낮밤 화면 바꾸기">--:--</div>
      <div class="date" id="date"></div>
      <div class="sunline" id="sunline"></div>
      <div class="seals" id="seals"></div>
      <div class="soon" id="soon"></div>
    </div>
    <!-- 밤 화면 오른쪽: 요일·날짜·음력과 그림 -->
    <div class="nright" id="nright">
      <div class="nw" id="nWday"></div>
      <div class="nd" id="nDate"></div>
      <div class="nl" id="nLunar"></div>
      <div class="nicons" id="nicons" aria-hidden="true"></div>
    </div>
    <div class="side">
      <div class="row tap" id="wxRow" role="button" tabindex="0" aria-label="날씨, 눌러서 시간별 날씨 보기"><span></span><div class="off">날씨를 불러오는 중이에요.</div></div>
      <div class="row" id="outRow"><span></span><div class="off">미세먼지를 불러오는 중이에요.</div></div>
      <button type="button" class="row" id="inRow" aria-label="우리집 공기, 눌러서 지난 24시간 보기"><span></span><span class="off">공기청정기를 확인하는 중이에요.</span></button>
    </div>
    <button type="button" class="lamp fanb" id="fanBtn" hidden aria-pressed="false" aria-expanded="false" aria-controls="pnl" aria-label="공기청정기 설정 열기"><span id="fanIcon"></span>청정기</button>
    <div class="pnl" id="pnl" hidden role="dialog" aria-label="공기청정기 설정">
      <div class="pnl-h"><span>공기청정기</span><button type="button" id="pnlClose">닫기 ✕</button></div>
      <div class="pr"><span>전원</span><div class="seg" data-act="power"><button type="button" data-v="on">켜짐</button><button type="button" data-v="off">꺼짐</button></div></div>
      <div class="pr"><span>모드</span><div class="seg" data-act="mode"><button type="button" data-v="Auto">자동</button><button type="button" data-v="Silent">수면</button><button type="button" data-v="Favorite">수동</button></div></div>
      <div class="pr"><span>세기</span><div class="lv"><button type="button" id="lvDown" aria-label="세기 낮추기">－</button><i><b id="lvBar"></b></i><button type="button" id="lvUp" aria-label="세기 높이기">＋</button><span id="lvText"></span></div></div>
      <div class="pr"><span>불빛</span><div class="seg" data-act="led"><button type="button" data-v="bright">밝게</button><button type="button" data-v="dim">어둡게</button><button type="button" data-v="off">끄기</button></div></div>
    </div>
    <button type="button" class="lamp" id="lamp" hidden aria-pressed="false" aria-label="주방등 켜기"><span id="lampIcon"></span>주방</button>
    <div class="nseal" id="nseal" aria-hidden="true"></div>
    <span class="seal batt" id="batt" hidden role="status"></span>
    <!-- 눌러서 여는 창: 시간별 날씨 / 절기 풀이 / 우리집 공기 24시간 -->
    <div class="pnl info" id="wxPnl" hidden role="dialog" aria-label="시간별 날씨"></div>
    <div class="pnl info" id="termPnl" hidden role="dialog" aria-label="절기 풀이"></div>
    <div class="pnl info" id="airPnl" hidden role="dialog" aria-label="우리집 공기 지난 24시간"></div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<section class="sheet" id="haSheet" aria-label="공기청정기 연결">
  <button type="button" class="close" data-close>닫기</button>
  <div class="sheet-in">
    <h2>공기청정기 연결 (Home Assistant)</h2>
    <p>보통은 노트9 안의 프로그램이 공기청정기 값을 자동으로 넣어 줘서 비워 두면 돼요. Home Assistant 센서를 직접 쓰고 싶을 때만 입력하세요. 입력한 값은 이 기기에만 저장돼요.</p>
    <form id="haForm" autocomplete="off">
      <label class="field"><span>Home Assistant 주소</span><input id="haUrl" placeholder="http://localhost:8123" inputmode="url"></label>
      <label class="field"><span>장기 액세스 토큰</span><input id="haToken" type="password" placeholder="프로필 → 보안 → 장기 액세스 토큰"></label>
      <label class="field"><span>초미세먼지(PM2.5) 센서 — 비워 두면 자동으로 찾아요</span><input id="haPm" placeholder="자동으로 찾기"></label>
      <label class="field"><span>습도 센서 (선택)</span><input id="haHum" placeholder="자동으로 찾기"></label>
      <label class="field"><span>온도 센서 (선택)</span><input id="haTemp" placeholder="자동으로 찾기"></label>
      <div class="actions">
        <button type="submit" class="pri">저장하고 연결</button>
        <button type="button" id="haClear">연결 지우기</button>
        <span id="haMsg" aria-live="polite"></span>
      </div>
    </form>
  </div>
</section>

<script>
const LAT = 37.6, LON = 127.3;
const $ = s => document.querySelector(s);
const load = k => { try { return JSON.parse(localStorage.getItem('hub-' + k)); } catch (e) { return null; } };
const save = (k, v) => { try { localStorage.setItem('hub-' + k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const DAYS = ['일', '월', '화', '수', '목', '금', '토'];

/* 우리집 기념일: { m: 월, d: 일, name: '이름', lunar: true(음력일 때) } */
const MY_DAYS = [];

/* ───────── 날짜 계산 (한국 시간 기준) ───────── */
const DAY = 86400000;
// 한국 날짜를 '날짜 번호'(1970-01-01부터 며칠째)로
const kstNum = (d = new Date()) => Math.floor((d.getTime() + 9 * 3600000) / DAY);
const numDate = n => { const d = new Date(n * DAY); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), w: d.getUTCDay() }; };
const ymdNum = (y, m, d) => Math.floor(Date.UTC(y, m - 1, d) / DAY);

// 음력: 브라우저의 한국 달력(dangi)
let lunarFmt = null;
try {
  lunarFmt = new Intl.DateTimeFormat('en-u-ca-dangi', { timeZone: 'UTC', year: 'numeric', month: 'numeric', day: 'numeric' });

async function localAir() {

  } catch (e) { return null; }
}
async function indoorAir() {

/* 밤 화면 그림 3개: 날씨 / 바깥 공기 / 우리집 공기 */
// 음력 날짜로 그린 달 모양 (1일 그믐→15일 보름→29일 그믐, 차오를 땐 오른쪽이 밝음)
function moonIcon(day, p) {
  const f = ((day - 1) / 29.53) % 1, cx = 20, cy = 20, r = 14;
  const disc = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${p.cloud}"/>`;
  if (f < 0.03 || f > 0.97) return svg(disc + `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${p.edge}" stroke-width="1.2"/>`);
  const rx = Math.abs(Math.cos(2 * Math.PI * f)) * r;
  const wax = f < 0.5, crescent = f < 0.25 || f > 0.75;
  const outer = wax ? 1 : 0;                          // 밝은 쪽 반원 (오른쪽/왼쪽)
  const inner = wax ? (crescent ? 0 : 1) : (crescent ? 1 : 0); // 명암 경계선
  return svg(disc + `<path d="M${cx} ${cy - r}A${r} ${r} 0 0 ${outer} ${cx} ${cy + r}A${rx.toFixed(2)} ${r} 0 0 ${inner} ${cx} ${cy - r}z" fill="${p.moon}"/>`);
}
function drawIcons() {
  const clearNight = ['sun', 'moon', 'partly', 'partlyNight'].includes(wxKind);
  const l = lunar(kstNum());
  const first = clearNight && l ? moonIcon(l.d, { cloud: '#2A241C', edge: '#4A4037', moon: '#BFA98A' }) : wxIcon({ sun: 'moon', partly: 'partlyNight' }[wxKind] || wxKind, PAL.night);
  $('#nicons').innerHTML = `<span>${first}</span><span>${hillIcon(PAL.night, outG)}</span><span>${houseIcon(PAL.night, inG)}</span>`;

async function findSensors() {
  const r = await fetch(`${ha.url.replace(/\/+$/, '')}/api/states`, { headers: { Authorization: `Bearer ${ha.token}` } });
  if (r.status === 401) throw new Error('토큰이 맞지 않아요.');
  if (!r.ok) throw new Error(`응답 오류 (${r.status})`);
  const all = (await r.json()).filter(s => s.entity_id.startsWith('sensor.'));
  const byClass = c => all.filter(s => s.attributes && s.attributes.device_class === c);
  const pm = byClass('pm25')[0];
  if (!pm) throw new Error('초미세먼지 센서를 찾지 못했어요. 센서 이름을 직접 넣어 주세요.');
  const prefix = pm.entity_id.replace(/_pm2_?5$/, '');
  const pick = c => (byClass(c).find(s => s.entity_id.startsWith(prefix)) || byClass(c)[0] || {}).entity_id || '';
  return { pm: pm.entity_id, hum: pick('humidity'), temp: pick('temperature') };
}

let PUR_HOOK = null;

const MODE_KEY = { auto: 'Auto', silent: 'Silent', favorite: 'Favorite' };
const fanSvg = on => svg(`<rect x="11" y="5" width="18" height="30" rx="4" fill="#FFFCF6" stroke="${on ? '#3F6A2C' : '#A8967A'}" stroke-width="2"/><circle cx="20" cy="15" r="5" fill="none" stroke="${on ? '#3F6A2C' : '#7FA36A'}" stroke-width="2.2"/><path d="M15 26h10M15 30h10" stroke="${on ? '#3F6A2C' : '#A8967A'}" stroke-width="2" stroke-linecap="round"/>`);
function drawPurifier() {
  const on = !!pur && pur.power === 'on';
  $('#fanIcon').innerHTML = fanSvg(on);
  $('#fanBtn').setAttribute('aria-pressed', String(on));
  if (!pur) return;
  const sel = { power: pur.power, mode: MODE_KEY[pur.mode] || '', led: pur.led };
  document.querySelectorAll('#pnl .seg').forEach(g => g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === sel[g.dataset.act]))));
  const lv = Number.isFinite(pur.level) ? pur.level : 0;
  $('#lvBar').style.width = Math.round(lv / 17 * 100) + '%';
  $('#lvText').textContent = `${lv} / 17`;
}
function setPurifier(j) {
  if (!j || !j.ok) return;
  if ($('#pnl').classList.contains('busy')) return; // 명령 보내는 중에는 화면 유지
  if (j.updated < lastCmd + 3) return; // 명령 전에 읽은 값이면 무시 (화면이 되돌아가지 않게)
  pur = { power: j.power, mode: j.mode, level: j.level, led: j.led };

}
let pnlTimer = 0;
const pnlIdle = () => { clearTimeout(pnlTimer); pnlTimer = setTimeout(closePnl, 20000); };
function openPnl() { $('#pnl').hidden = false; $('#fanBtn').setAttribute('aria-expanded', 'true'); drawPurifier(); pnlIdle(); }
function closePnl() { $('#pnl').hidden = true; $('#fanBtn').setAttribute('aria-expanded', 'false'); clearTimeout(pnlTimer); }

let refreshTimers = [], lastCmd = 0;
async function purCmd(action, value, optimistic) {
  if (!PUR_HOOK) return;
  pnlIdle();
  const p = $('#pnl');
  p.classList.add('busy');
  try {
    const r = await fetch(PUR_HOOK, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, value: String(value) }) });
    if (!r.ok) throw new Error(String(r.status));
    lastCmd = Math.floor(Date.now() / 1000);
    if (pur) { Object.assign(pur, optimistic); drawPurifier(); }
  } catch (e) {
    toast('공기청정기에 명령을 보내지 못했어요');
  } finally {
    p.classList.remove('busy');
    // 공기청정기가 바뀐 값을 air.json에 반영할 시간(최대 30초)을 두고 다시 읽기
    refreshTimers.forEach(clearTimeout);
    refreshTimers = [setTimeout(indoorAir, 35000), setTimeout(indoorAir, 65000)];
  }
}

}));

  동지: ['冬至', '한 해 중 밤이 가장 긴 날이에요. 팥죽을 쑤어 나쁜 기운을 쫓았어요.', '속담 · 동지 지나 열흘이면 해가 노루 꼬리만큼 길어진다']
};
function drawTermPanel() {
  const t = curTerm; if (!t) return;
  const info = TERM_INFO[t.name] || ['', '', ''], d = numDate(t.n);
  $('#termPnl').innerHTML = infoHead(`<span class="seal">${t.name}</span> ${info[0]} · ${d.m}월 ${d.d}일`) + `<div class="term-t">${info[1]}</div><div class="term-s">${info[2]}</div>`;
}
const termTap = e => { if (e.target.closest('.seal[data-term]')) openInfo('#termPnl', drawTermPanel); };
$('#seals').addEventListener('click', termTap);
$('#seals').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.seal[data-term]')) { e.preventDefault(); termTap(e); } });

/* 우리집 공기 지난 24시간 (노트9의 air-history.json) */
const hourText = ts => { const h = new Date(ts * 1000).getHours(); return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}시`; };
async function drawAirPanel() {
  $('#airPnl').innerHTML = infoHead('우리집 공기 · 지난 24시간') + '<div class="off">기록을 불러오는 중이에요.</div>';
  let h = [];
  try { const r = await fetch('air-history.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) h = await r.json(); } catch (e) {}
  const now = Date.now() / 1000;
  h = (Array.isArray(h) ? h : []).filter(x => now - x[0] <= 24 * 3600);
  const foot = msg => `<div class="graph-s"><span>${msg}</span><button type="button" id="openSheet">연결 설정</button></div>`;
  let body;
  if (h.length < 2) {
    body = `<div class="off" style="padding:16px 0">기록을 모으는 중이에요. 10분마다 하나씩 쌓여서 하루가 지나면 그래프가 채워져요.</div>` + foot('');
  } else {
    // 요리할 때처럼 잠깐 튄 값 하나 때문에 그래프 전체가 납작해지지 않게, 눈금은 95% 지점으로 잡고 넘치는 값은 위쪽 끝에 붙임
    const sorted = h.map(x => x[1]).sort((a, b) => a - b), p95 = sorted[Math.floor((sorted.length - 1) * 0.95)];
    const W = 400, H = 110, t0 = now - 24 * 3600, top = Math.max(60, p95 * 1.5);
    const X = ts => ((ts - t0) / (24 * 3600) * W).toFixed(1), Y = v => Math.max(6, H - Math.min(v, top) / top * H).toFixed(1);
    const max = h.reduce((a, b) => b[1] > a[1] ? b : a), avg = Math.round(h.reduce((s, x) => s + x[1], 0) / h.length);
    const y35 = Y(35), y15 = Y(15);
    body = `<div class="graph"><svg viewBox="0 0 ${W} ${H + 22}" role="img" aria-label="지난 24시간 초미세먼지 그래프">
      <rect x="0" y="${y15}" width="${W}" height="${(y15 - y35).toFixed(1)}" fill="var(--g1)" opacity=".08"/>
      <line x1="0" x2="${W}" y1="${y35}" y2="${y35}" stroke="var(--g2)" stroke-dasharray="4 4"/>
      <polyline points="${h.map(x => X(x[0]) + ',' + Y(x[1])).join(' ')}" fill="none" stroke="var(--g1)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="2" y="${y35 - 6}" font-size="12" fill="var(--g2)" stroke="var(--paper)" stroke-width="4" paint-order="stroke">나쁨 기준 35</text>
      <circle cx="${X(max[0])}" cy="${Y(max[1])}" r="5" fill="var(--g${grade(max[1], CUT.pm25)})"/>
      <text x="${Math.min(W - 40, Math.max(40, X(max[0])))}" y="${Math.max(12, Y(max[1]) - 9)}" text-anchor="middle" font-size="13" fill="var(--sub)">${max[1]}</text>
      <text x="0" y="${H + 18}" font-size="12" fill="var(--sub)">어제 ${hourText(t0)}</text>
      <text x="${W / 2}" y="${H + 18}" text-anchor="middle" font-size="12" fill="var(--sub)">${hourText(t0 + 12 * 3600)}</text>
      <text x="${W}" y="${H + 18}" text-anchor="end" font-size="12" fill="var(--sub)">지금</text></svg></div>` +
      foot(`평균 초미세 ${avg} · 가장 높을 때 ${max[1]} (${hourText(max[0])}쯤)`);
  }
  $('#airPnl').innerHTML = infoHead('우리집 공기 · 지난 24시간') + body;
  $('#openSheet').addEventListener('click', () => { closeInfo(); openSheet(); });
}
$('#inRow').addEventListener('click', () => openInfo('#airPnl', drawAirPanel));

/* 노트9 배터리 경고 (노트9의 battery.json, 문제가 있을 때만 표시) */
async function battery() {
  let b = null;
  try { const r = await fetch('battery.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) b = await r.json(); } catch (e) {}
  const el = $('#batt');
  if (!b || Date.now() / 1000 - b.updated > 15 * 60) { el.hidden = true; return; }
  const msg = b.temperature >= 42 ? `배터리 뜨거움 · ${Math.round(b.temperature)}°`
    : b.plugged === 'UNPLUGGED' ? `⚡ 충전기 확인 · ${b.percentage}%`
    : b.percentage <= 15 ? `배터리 부족 · ${b.percentage}%` : '';
  el.textContent = msg; el.hidden = !msg;
}

/* ───────── 시작과 갱신 주기 ───────── */
tick();
setTimeout(() => { tick(); setInterval(tick, 60000); }, (60 - new Date().getSeconds()) * 1000);
function refreshOutdoor() { weather(); outdoorAir(); }
refreshOutdoor();
indoorAir();
setInterval(refreshOutdoor, 30 * 60 * 1000);
setInterval(indoorAir, 60 * 1000);
battery();
setInterval(battery, 2 * 60 * 1000);

/* 화면 켜짐 유지 */
let lock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) {}
}
document.addEventListener('click', keepAwake);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); refreshOutdoor(); indoorAir(); } });
</script>
